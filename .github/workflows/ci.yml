name: CI

# Pull requests and pushes to main. Tag pushes stay on release.yml, which
# publishes the installer. This job never publishes.
#
# CSC_IDENTITY_AUTO_DISCOVERY=false keeps the PR build unsigned even if the
# runner has an unrelated certificate. Do not set CSC_LINK here.
# The Store appx is produced unsigned on purpose. Partner Center re-signs it.
# scripts/sign-windows.js skips *.appx even if CSC_LINK is set on a release.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and bridge smoke test
        run: npm run smoke

      - name: Build unsigned NSIS installer and Store appx
        run: npm run dist

      - name: Upload NSIS and Store packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/**/*.appx
